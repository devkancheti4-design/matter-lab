<title>Shape Walk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Roboto+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#FFFFFF; --surf:#FFFFFF; --s1:#F5F7FB; --s2:#ECEFF6;
  --line:#DFE3ED; --line-soft:#EBEEF5;
  --on:#161A22; --on2:#575D6C; --on3:#8B91A1;
  --pri:#3B5BFF; --on-pri:#FFFFFF; --pri-soft:#EAEEFF;
  --stage:#07090F; --stage-on:#EDEFF6; --stage-on2:#9AA1B4;
  --pos:#4C7DFF; --neg:#FF5D73; --gold:#F5B841; --mint:#4BE0B0;
  --e1:0 1px 2px rgba(16,20,32,.07),0 1px 3px rgba(16,20,32,.05);
  --e2:0 2px 6px rgba(16,20,32,.07),0 6px 16px rgba(16,20,32,.07);
  --ff:"DM Sans",system-ui,-apple-system,sans-serif;
  --ff-m:"Roboto Mono",ui-monospace,Menlo,monospace;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C0E13; --surf:#12151B; --s1:#171B23; --s2:#1F242E;
  --line:#2A303C; --line-soft:#21262F;
  --on:#E8EAF0; --on2:#A3A9B8; --on3:#6F7584;
  --pri:#93A6FF; --on-pri:#0C0E13; --pri-soft:#1A2036;
  --e1:0 1px 2px rgba(0,0,0,.5); --e2:0 2px 8px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#0C0E13; --surf:#12151B; --s1:#171B23; --s2:#1F242E;
  --line:#2A303C; --line-soft:#21262F;
  --on:#E8EAF0; --on2:#A3A9B8; --on3:#6F7584;
  --pri:#93A6FF; --on-pri:#0C0E13; --pri-soft:#1A2036;
  --e1:0 1px 2px rgba(0,0,0,.5); --e2:0 2px 8px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--on);font-family:var(--ff);
  font-size:14px;line-height:1.5;letter-spacing:-.004em;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:8px}
#app{height:100%;display:flex;flex-direction:column}

.top{flex:0 0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px clamp(12px,2vw,20px);background:var(--surf);border-bottom:1px solid var(--line-soft)}
.mark{width:30px;height:30px;border-radius:50%;flex:0 0 auto;
  background:radial-gradient(circle at 34% 30%,#fff,var(--pos) 55%,#16205E);box-shadow:var(--e1)}
.nm{font-weight:700;font-size:16px;letter-spacing:-.025em}
.sb{font-size:11.5px;color:var(--on3);line-height:1.2}
.top .grow{flex:1}
.ghost{border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:13px;
  font-weight:600;background:var(--surf);transition:.14s;display:inline-flex;align-items:center;gap:7px;
  text-decoration:none;color:inherit;white-space:nowrap}
.ghost:hover{background:var(--s2);box-shadow:var(--e1)}
.ghost.on{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}

.body{flex:1;min-height:0;display:flex}
.stage{flex:1;min-width:0;position:relative;background:var(--stage);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas.drag{cursor:grabbing}
.hud{position:absolute;pointer-events:none;font-family:var(--ff-m);font-size:11px;color:var(--stage-on2)}
.hud.tl{top:14px;left:16px}
.hud.tr{top:14px;right:16px;text-align:right}
.hud.bl{bottom:14px;left:16px}
.hud b{color:var(--stage-on);font-weight:500}
.bigorb{font-family:var(--ff);font-size:clamp(26px,4vw,44px);font-weight:700;
  letter-spacing:-.03em;color:var(--stage-on);line-height:1;margin-bottom:2px}
.bigorb sup{font-size:.45em;vertical-align:super;color:var(--mint)}
.legend{position:absolute;left:16px;bottom:58px;display:flex;gap:14px;font-size:11px;
  color:var(--stage-on2);font-family:var(--ff-m);pointer-events:none}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}

.panel{flex:0 0 340px;border-left:1px solid var(--line-soft);background:var(--surf);
  overflow-y:auto;overscroll-behavior:contain}
.blk{padding:16px 18px;border-bottom:1px solid var(--line-soft)}
.blk:last-child{border-bottom:0}
.kick{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--on3);margin:0 0 11px}
.zrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.zval{font-family:var(--ff-m);font-size:30px;font-weight:700;min-width:62px;letter-spacing:-.02em}
.zlab{flex:1;min-width:0}
.zlab .el{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.zlab .su{font-size:12px;color:var(--on3);font-family:var(--ff-m)}
.step{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surf);
  font-size:19px;line-height:1;display:grid;place-items:center;transition:.14s;flex:0 0 auto}
.step:hover:not(:disabled){background:var(--pri);color:var(--on-pri);border-color:var(--pri)}
.step:disabled{opacity:.35;cursor:not-allowed}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;
  background:var(--s2);outline:none;margin:4px 0 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--pri);border:3px solid var(--surf);box-shadow:var(--e1);cursor:grab}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--pri);
  border:3px solid var(--surf);cursor:grab}
.btnrow{display:flex;gap:8px}
.btn{flex:1;border-radius:999px;padding:10px 14px;font-size:13px;font-weight:600;
  background:var(--pri);color:var(--on-pri);transition:.14s;box-shadow:var(--e1)}
.btn.sec{background:var(--surf);color:var(--on);border:1px solid var(--line);box-shadow:none}
.btn.sec:hover{background:var(--s1)}
.btn:hover{filter:brightness(1.06)}
dl.sheet{display:grid;grid-template-columns:1fr auto;gap:0;margin:0}
dl.sheet dt{color:var(--on2);font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--line-soft)}
dl.sheet dd{margin:0;font-family:var(--ff-m);font-size:11.5px;text-align:right;
  padding:7px 0;border-bottom:1px solid var(--line-soft);font-variant-numeric:tabular-nums}
dl.sheet dt:last-of-type,dl.sheet dd:last-of-type{border-bottom:0}
.cfg{font-family:var(--ff-m);font-size:12px;line-height:1.9;word-break:break-word}
.cfg span{padding:2px 5px;border-radius:5px;margin-right:2px}
.cfg span.now{background:var(--pri);color:var(--on-pri);font-weight:700}
.cfg span.done{background:var(--s2);color:var(--on2)}
.note{background:var(--s1);border-radius:12px;padding:12px 14px;font-size:13px;
  line-height:1.6;color:var(--on2);border-left:3px solid var(--c,var(--pri))}
.shapes{display:flex;gap:6px;flex-wrap:wrap}
.sh{border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;
  font-family:var(--ff-m);background:var(--surf);transition:.14s}
.sh.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri);font-weight:700}
.seg{display:flex;gap:3px;padding:4px;border-radius:999px;background:var(--s2)}
.seg button{flex:1;padding:7px 10px;border-radius:999px;font-size:12.5px;font-weight:600;
  color:var(--on2);transition:.14s}
.seg button[aria-pressed="true"]{background:var(--surf);color:var(--on);box-shadow:var(--e1)}
@media (max-width:900px){
  body{overflow:auto}#app{height:auto;min-height:100%}
  .body{flex-direction:column}
  .stage{height:56vh;min-height:340px}
  .panel{flex-basis:auto;border-left:0;border-top:1px solid var(--line-soft)}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.08s!important}}
</style>

<div id="app">
  <header class="top">
    <div class="mark" aria-hidden="true"></div>
    <div>
      <div class="nm">Shape Walk</div>
      <div class="sb">one electron at a time, in three dimensions</div>
    </div>
    <div class="grow"></div>
    <button class="ghost" id="play">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" id="playIcon"><path d="M8 5.5v13l11-6.5-11-6.5Z"/></svg>
      <span id="playTxt">Walk</span>
    </button>
    <a class="ghost" href="index.html">&larr; Matter Lab</a>
  </header>

  <div class="body">
    <div class="stage">
      <canvas id="cv"></canvas>
      <div class="hud tl">
        <div class="bigorb" id="orbBig"></div>
        <div id="orbSub"></div>
      </div>
      <div class="hud tr" id="hudTR"></div>
      <div class="hud bl" id="hudBL">drag to turn it &middot; scroll to zoom</div>
      <div class="legend">
        <span><i style="background:var(--pos)"></i>positive lobe</span>
        <span><i style="background:var(--neg)"></i>negative lobe</span>
        <span><i style="background:var(--gold)"></i>newest electron</span>
      </div>
    </div>
    <aside class="panel" id="panel"></aside>
  </div>
</div>

<script>
"use strict";
const $=i=>document.getElementById(i);
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;

const EL=("H Hydrogen,He Helium,Li Lithium,Be Beryllium,B Boron,C Carbon,N Nitrogen,O Oxygen,"+
"F Fluorine,Ne Neon,Na Sodium,Mg Magnesium,Al Aluminium,Si Silicon,P Phosphorus,S Sulfur,"+
"Cl Chlorine,Ar Argon,K Potassium,Ca Calcium,Sc Scandium,Ti Titanium,V Vanadium,Cr Chromium,"+
"Mn Manganese,Fe Iron,Co Cobalt,Ni Nickel,Cu Copper,Zn Zinc,Ga Gallium,Ge Germanium,As Arsenic,"+
"Se Selenium,Br Bromine,Kr Krypton,Rb Rubidium,Sr Strontium,Y Yttrium,Zr Zirconium,Nb Niobium,"+
"Mo Molybdenum,Tc Technetium,Ru Ruthenium,Rh Rhodium,Pd Palladium,Ag Silver,Cd Cadmium,In Indium,"+
"Sn Tin,Sb Antimony,Te Tellurium,I Iodine,Xe Xenon,Cs Caesium,Ba Barium,La Lanthanum,Ce Cerium,"+
"Pr Praseodymium,Nd Neodymium,Pm Promethium,Sm Samarium,Eu Europium,Gd Gadolinium,Tb Terbium,"+
"Dy Dysprosium,Ho Holmium,Er Erbium,Tm Thulium,Yb Ytterbium,Lu Lutetium,Hf Hafnium,Ta Tantalum,"+
"W Tungsten,Re Rhenium,Os Osmium,Ir Iridium,Pt Platinum,Au Gold,Hg Mercury,Tl Thallium,Pb Lead,"+
"Bi Bismuth,Po Polonium,At Astatine,Rn Radon,Fr Francium,Ra Radium,Ac Actinium,Th Thorium,"+
"Pa Protactinium,U Uranium,Np Neptunium,Pu Plutonium,Am Americium,Cm Curium,Bk Berkelium,"+
"Cf Californium,Es Einsteinium,Fm Fermium,Md Mendelevium,No Nobelium,Lr Lawrencium,"+
"Rf Rutherfordium,Db Dubnium,Sg Seaborgium,Bh Bohrium,Hs Hassium,Mt Meitnerium,Ds Darmstadtium,"+
"Rg Roentgenium,Cn Copernicium,Nh Nihonium,Fl Flerovium,Mc Moscovium,Lv Livermorium,"+
"Ts Tennessine,Og Oganesson").split(",").map(s=>{const i=s.indexOf(" ");return{sym:s.slice(0,i),name:s.slice(i+1)};});
/* IUPAC systematic placeholder naming, for elements nobody has made */
const ROOT=["nil","un","bi","tri","quad","pent","hex","sept","oct","enn"];
function systematic(z){
  const d=String(z).split("").map(Number);
  /* IUPAC elisions, and only these two: the final n of "enn" drops before
     "nil", and the final i of "bi"/"tri" drops before "ium". "ennium" keeps
     its double n -- 119 is ununennium. */
  let nm=d.map(x=>ROOT[x]).join("");
  nm=nm.replace(/ennnil/g,"ennil")+"ium";
  nm=nm.replace(/iium/g,"ium");
  const sym=d.map(x=>ROOT[x][0]).join("");
  return {sym:sym.charAt(0).toUpperCase()+sym.slice(1),
          name:nm.charAt(0).toUpperCase()+nm.slice(1),predicted:true};
}
const ZMAX=168;
for(let z=119;z<=ZMAX;z++) EL.push(systematic(z));

/* ---------- real spherical harmonics, l = 0..3 ---------- */
function Y(l,m,th,ph){
  const c=Math.cos(th),s=Math.sin(th);
  if(l===0) return 0.5*Math.sqrt(1/Math.PI);
  if(l===1){
    if(m===0)  return 0.5*Math.sqrt(3/Math.PI)*c;
    if(m===1)  return 0.5*Math.sqrt(3/Math.PI)*s*Math.cos(ph);
    return            0.5*Math.sqrt(3/Math.PI)*s*Math.sin(ph);
  }
  if(l===2){
    if(m===0)  return 0.25*Math.sqrt(5/Math.PI)*(3*c*c-1);
    if(m===1)  return 0.5*Math.sqrt(15/Math.PI)*s*c*Math.cos(ph);
    if(m===-1) return 0.5*Math.sqrt(15/Math.PI)*s*c*Math.sin(ph);
    if(m===2)  return 0.25*Math.sqrt(15/Math.PI)*s*s*Math.cos(2*ph);
    return            0.25*Math.sqrt(15/Math.PI)*s*s*Math.sin(2*ph);
  }
  if(m===0)  return 0.25*Math.sqrt(7/Math.PI)*(5*c*c*c-3*c);
  if(m===1)  return 0.125*Math.sqrt(42/Math.PI)*s*(5*c*c-1)*Math.cos(ph);
  if(m===-1) return 0.125*Math.sqrt(42/Math.PI)*s*(5*c*c-1)*Math.sin(ph);
  if(m===2)  return 0.25*Math.sqrt(105/Math.PI)*s*s*c*Math.cos(2*ph);
  if(m===-2) return 0.25*Math.sqrt(105/Math.PI)*s*s*c*Math.sin(2*ph);
  if(l===3){
    if(m===3)  return 0.125*Math.sqrt(70/Math.PI)*s*s*s*Math.cos(3*ph);
    return            0.125*Math.sqrt(70/Math.PI)*s*s*s*Math.sin(3*ph);
  }
  /* l = 4, the g orbitals. only reachable past element 120. */
  const X=s*Math.cos(ph), Yy=s*Math.sin(ph), Zz=c, PI=Math.PI;
  if(m===0)  return (3/16)*Math.sqrt(1/PI)*(35*Math.pow(Zz,4)-30*Zz*Zz+3);
  if(m===1)  return (3/4)*Math.sqrt(5/(2*PI))*X*Zz*(7*Zz*Zz-3);
  if(m===-1) return (3/4)*Math.sqrt(5/(2*PI))*Yy*Zz*(7*Zz*Zz-3);
  if(m===2)  return (3/8)*Math.sqrt(5/PI)*(X*X-Yy*Yy)*(7*Zz*Zz-1);
  if(m===-2) return (3/4)*Math.sqrt(5/PI)*X*Yy*(7*Zz*Zz-1);
  if(m===3)  return (3/4)*Math.sqrt(35/(2*PI))*(X*X-3*Yy*Yy)*X*Zz;
  if(m===-3) return (3/4)*Math.sqrt(35/(2*PI))*(3*X*X-Yy*Yy)*Yy*Zz;
  if(m===4)  return (3/16)*Math.sqrt(35/PI)*(Math.pow(X,4)-6*X*X*Yy*Yy+Math.pow(Yy,4));
  return            (3/4)*Math.sqrt(35/PI)*X*Yy*(X*X-Yy*Yy);
}
const LSET={
  s:[[0,0,"s"]],
  p:[[1,1,"pₓ"],[1,-1,"pᵧ"],[1,0,"pᶻ"]],
  d:[[2,0,"dᶻ²"],[2,2,"dₓ²₋ᵧ²"],[2,-2,"dₓᵧ"],
     [2,1,"dₓᶻ"],[2,-1,"dᵧᶻ"]],
  f:[[3,0,"fᶻ³"],[3,1,"fₓᶻ²"],[3,-1,"fᵧᶻ²"],
     [3,2,"fᶻ(ₓ²₋ᵧ²)"],[3,-2,"fₓᵧᶻ"],
     [3,3,"fₓ³"],[3,-3,"fᵧ³"]],
  g:[[4,0,"g₁"],[4,1,"g₂"],[4,-1,"g₃"],[4,2,"g₄"],[4,-2,"g₅"],
     [4,3,"g₆"],[4,-3,"g₇"],[4,4,"g₈"],[4,-4,"g₉"]]
};
const CAP={s:2,p:6,d:10,f:14,g:18};
const ORDER=[[1,"s"],[2,"s"],[2,"p"],[3,"s"],[3,"p"],[4,"s"],[3,"d"],[4,"p"],[5,"s"],[4,"d"],
[5,"p"],[6,"s"],[4,"f"],[5,"d"],[6,"p"],[7,"s"],[5,"f"],[6,"d"],[7,"p"],
[8,"s"],[5,"g"],[6,"f"],[7,"d"],[8,"p"]];  /* past 118: what the rule predicts */
const SUP={0:"⁰",1:"¹",2:"²",3:"³",4:"⁴",5:"⁵",6:"⁶",7:"⁷",8:"⁸",9:"⁹"};
const sup=n=>String(n).split("").map(d=>SUP[d]).join("");

/* every electron, in order, with the orbital it occupies (Hund: singles first) */
function electrons(total){
  const out=[];
  for(const [n,l] of ORDER){
    if(out.length>=total) break;
    const set=LSET[l], cap=CAP[l];
    const take=Math.min(cap,total-out.length);
    for(let i=0;i<take;i++){
      const orb=i%set.length;
      out.push({n,l,orb,m:set[orb][1],lq:set[orb][0],label:set[orb][2],
        spin:i<set.length?"up":"down",sub:n+l,idx:out.length});
    }
  }
  return out;
}
function config(total,markLast){
  const parts=[];let left=total;
  for(const [n,l] of ORDER){
    if(left<=0)break;
    const k=Math.min(CAP[l],left);parts.push([n+l,k]);left-=k;
  }
  return parts.map((p,i)=>({t:p[0]+sup(p[1]),now:markLast&&i===parts.length-1}));
}

/* ---------- mesh for one orbital: r = |Y(l,m)| ---------- */
const MESH={};
function mesh(l,m){
  const key=l+":"+m; if(MESH[key])return MESH[key];
  const NT=20,NP=40,V=[];
  for(let i=0;i<=NT;i++){
    const th=i/NT*Math.PI, row=[];
    for(let j=0;j<=NP;j++){
      const ph=j/NP*Math.PI*2;
      const y=Y(l,m,th,ph), r=Math.abs(y);
      row.push({x:r*Math.sin(th)*Math.cos(ph),y:r*Math.sin(th)*Math.sin(ph),z:r*Math.cos(th),
        s:y>=0?1:-1,r:r});
    }
    V.push(row);
  }
  let mx=0; V.forEach(row=>row.forEach(v=>{if(v.r>mx)mx=v.r;}));
  V.forEach(row=>row.forEach(v=>{v.x/=mx;v.y/=mx;v.z/=mx;v.r/=mx;}));
  const faces=[];
  for(let i=0;i<NT;i++)for(let j=0;j<NP;j++){
    const a=V[i][j],b=V[i+1][j],c=V[i+1][j+1],d=V[i][j+1];
    if(a.r<1e-4&&b.r<1e-4&&c.r<1e-4&&d.r<1e-4)continue;
    faces.push([a,b,c,d,a.s]);
  }
  /* lobe directions: cluster the vertices closest to max radius */
  /* an s orbital is a sphere: it has no preferred direction at all */
  const pts=[]; if(l>0) V.forEach(row=>row.forEach(v=>{if(v.r>0.97)pts.push(v);}));
  const axes=[];
  pts.sort((p,q)=>q.r-p.r);
  pts.forEach(p=>{
    const n=Math.hypot(p.x,p.y,p.z)||1;
    const u={x:p.x/n,y:p.y/n,z:p.z/n,s:p.s};
    /* one cluster per lobe: merge anything within ~53 degrees */
    if(!axes.some(a=>a.x*u.x+a.y*u.y+a.z*u.z>0.6)) axes.push(u);
  });
  MESH[key]={faces,axes};
  return MESH[key];
}

/* ---------- state ---------- */
const S={e:1,view:"subshell",yaw:0.6,pitch:-0.35,zoom:1,playing:false,drag:null,auto:0};
const cv=$("cv"),ctx=cv.getContext("2d");
let W=0,H=0;
function fit(){const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);
  W=Math.max(1,r.width);H=Math.max(1,r.height);
  cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);}
new ResizeObserver(fit).observe(cv);

function rot(p){
  const cy=Math.cos(S.yaw),sy=Math.sin(S.yaw),cp=Math.cos(S.pitch),sp=Math.sin(S.pitch);
  const x=p.x*cy-p.y*sy, y=p.x*sy+p.y*cy;
  return {x:x, y:y*cp-p.z*sp, z:y*sp+p.z*cp};
}
function proj(p,scale){
  const d=4.2, k=d/(d+p.z);
  return [W/2+p.x*scale*k, H/2+p.y*scale*k, p.z, k];
}
const hex=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
function shade(rgb,f){return "rgb("+rgb.map(v=>Math.max(0,Math.min(255,Math.round(v*f)))).join(",")+")";}
const POS=hex("#4C7DFF"),NEG=hex("#FF5D73"),GOLD=hex("#F5B841");

function draw(t){
  ctx.clearRect(0,0,W,H);
  const g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.65);
  g.addColorStop(0,"rgba(76,125,255,.10)");g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  if(!REDUCED&&!S.drag&&S.auto) S.yaw+=0.0035;

  const es=electrons(S.e), last=es[es.length-1];
  const base=Math.min(W,H)*0.30*S.zoom;
  const inner=[...new Set(es.filter(x=>x.n<last.n).map(x=>x.n))];

  /* faint shells already complete */
  inner.forEach(n=>{
    const rr=base*(0.30+0.13*n);
    ctx.beginPath();ctx.ellipse(W/2,H/2,rr,rr*Math.abs(Math.cos(S.pitch))*0.55+rr*0.12,0,0,7);
    ctx.strokeStyle="rgba(150,170,220,.13)";ctx.lineWidth=1;ctx.stroke();
  });

  /* which orbitals to draw */
  let show;
  if(S.view==="new") show=[last];
  else if(S.view==="subshell") show=es.filter(x=>x.sub===last.sub);
  else show=es.filter(x=>x.n===last.n);
  const seen={},orbs=[];
  show.forEach(x=>{const k=x.sub+":"+x.orb;if(!seen[k]){seen[k]=1;orbs.push(x);}});

  const scale=base*(0.55+0.16*last.n);
  const tris=[];
  orbs.forEach(o=>{
    const M=mesh(o.lq,o.m);
    const isNew=(o.sub===last.sub&&o.orb===last.orb);
    M.faces.forEach(f=>{
      const P=[rot(f[0]),rot(f[1]),rot(f[2]),rot(f[3])];
      const z=(P[0].z+P[1].z+P[2].z+P[3].z)/4;
      const ax=P[1].x-P[0].x,ay=P[1].y-P[0].y,az=P[1].z-P[0].z;
      const bx=P[3].x-P[0].x,by=P[3].y-P[0].y,bz=P[3].z-P[0].z;
      let nx=ay*bz-az*by, ny=az*bx-ax*bz, nz=ax*by-ay*bx;
      const nl=Math.hypot(nx,ny,nz)||1; nx/=nl;ny/=nl;nz/=nl;
      const lit=Math.max(0.18,Math.min(1,0.35+0.75*Math.abs(nx*0.4+ny*(-0.5)+nz*(-0.75))));
      tris.push({z,P,lit,s:f[4],isNew});
    });
    /* the "strings": lobe axes, showing where bonds can attach */
    M.axes.forEach(a=>{
      const p0=proj(rot({x:0,y:0,z:0}),scale), p1=proj(rot({x:a.x*1.35,y:a.y*1.35,z:a.z*1.35}),scale);
      tris.push({z:9e9,line:[p0,p1],isNew});
    });
  });
  tris.sort((a,b)=>a.z-b.z);
  tris.forEach(f=>{
    if(f.line){
      ctx.beginPath();ctx.moveTo(f.line[0][0],f.line[0][1]);ctx.lineTo(f.line[1][0],f.line[1][1]);
      ctx.strokeStyle=f.isNew?"rgba(245,184,65,.55)":"rgba(160,180,230,.22)";
      ctx.lineWidth=1.2;ctx.setLineDash([3,4]);ctx.stroke();ctx.setLineDash([]);
      ctx.beginPath();ctx.arc(f.line[1][0],f.line[1][1],2.6,0,7);
      ctx.fillStyle=f.isNew?"rgba(245,184,65,.9)":"rgba(160,180,230,.45)";ctx.fill();
      return;
    }
    const q=f.P.map(p=>proj(p,scale));
    ctx.beginPath();ctx.moveTo(q[0][0],q[0][1]);
    for(let i=1;i<4;i++)ctx.lineTo(q[i][0],q[i][1]);
    ctx.closePath();
    const rgb=f.isNew?GOLD:(f.s>0?POS:NEG);
    ctx.fillStyle=shade(rgb,f.lit*(f.isNew?1.05:0.92));
    ctx.fill();
    ctx.strokeStyle="rgba(0,0,0,.10)";ctx.lineWidth=.4;ctx.stroke();
  });

  ctx.font='500 11px "Roboto Mono",monospace';ctx.textAlign="center";
  ctx.fillStyle="rgba(180,195,230,.35)";
  ctx.fillText(orbs.length+" orbital"+(orbs.length>1?"s":"")+" drawn · "+
    (S.view==="new"?"newest only":S.view==="subshell"?"this subshell":"whole shell"),W/2,H-16);
}

/* elements whose measured ground state disagrees with the filling rule.
   the walk shows the rule; these say where the rule is wrong. */
const EXC={24:"3d\u2075 4s\u00b9",29:"3d\u00b9\u2070 4s\u00b9",41:"4d\u2074 5s\u00b9",
42:"4d\u2075 5s\u00b9",44:"4d\u2077 5s\u00b9",45:"4d\u2078 5s\u00b9",46:"4d\u00b9\u2070 (no 5s)",
47:"4d\u00b9\u2070 5s\u00b9",57:"5d\u00b9 6s\u00b2 (no 4f)",58:"4f\u00b9 5d\u00b9 6s\u00b2",
64:"4f\u2077 5d\u00b9 6s\u00b2",78:"5d\u2079 6s\u00b9",79:"5d\u00b9\u2070 6s\u00b9",
89:"6d\u00b9 7s\u00b2",90:"6d\u00b2 7s\u00b2",91:"5f\u00b2 6d\u00b9 7s\u00b2",
92:"5f\u00b3 6d\u00b9 7s\u00b2",93:"5f\u2074 6d\u00b9 7s\u00b2",96:"5f\u2077 6d\u00b9 7s\u00b2",
103:"7p\u00b9 (no 6d)"};

/* ---------- panel ---------- */
const SHAPE_NOTE={
 0:["A sphere. No direction at all.","An s orbital points nowhere, so it makes no demands about bond angles. Hydrogen and helium have only this."],
 1:["Two lobes, one axis.","p orbitals come in three, at right angles to each other. That is where 90° bond angles come from — and once you mix them with s, the 109.5° of methane and the 104.5° bend of water."],
 2:["Four lobes, two nodal planes.","d orbitals point between the axes as often as along them. That is why transition metals bond in sixes and eights instead of fours, and why their compounds are coloured."],
 3:["Six or eight lobes, three nodal surfaces.","f orbitals are buried under the outer shells, so they barely touch chemistry. That is why the lanthanides are nearly indistinguishable from one another."],
 4:["Nine shapes, four nodal surfaces.","g orbitals have never been occupied by any atom that exists. The rule says they start filling at element 121, eighteen electrons across. Every shape you see here is a prediction that has never been tested against a real atom."]
};
function panel(){
  const es=electrons(S.e), last=es[es.length-1];
  const el=EL[S.e-1];
  const occ={};es.forEach(x=>{const k=x.sub+":"+x.orb;occ[k]=(occ[k]||0)+1;});
  const subOrbs=LSET[last.l];
  const nd=SHAPE_NOTE[last.lq]||["Shape","No description for this orbital family yet."];
  const parts=config(S.e,true);
  $("panel").innerHTML=
    '<div class="blk"><p class="kick">Electron</p>'+
      '<div class="zrow">'+
        '<button class="step" id="minus" aria-label="one fewer">&minus;</button>'+
        '<div class="zval">'+S.e+'</div>'+
        '<div class="zlab"><div class="el">'+el.name+'</div>'+
          '<div class="su">'+el.sym+' &middot; Z = '+S.e+'</div></div>'+
        '<button class="step" id="plus" aria-label="one more">+</button>'+
      '</div>'+
      '<input type="range" id="slider" min="1" max="168" value="'+S.e+'" aria-label="electron count">'+
    '</div>'+
    '<div class="blk"><p class="kick">The electron you just added</p>'+
      '<dl class="sheet">'+
        row("Goes into",last.sub+"  "+last.label)+
        row("Shape family","spdf"[last.lq]+"  (ℓ = "+last.lq+")")+
        row("Angular nodes",String(last.lq))+
        row("Lobe directions",last.lq===0?"none \u2014 spherical":String(mesh(last.lq,last.m).axes.length))+
        row("Spin",last.spin==="up"?"↑ up":"↓ down")+
        row("Shell","n = "+last.n)+
      '</dl></div>'+
    '<div class="blk"><p class="kick">'+nd[0]+'</p><p class="note" style="--c:var(--pri)">'+nd[1]+'</p></div>'+
    '<div class="blk"><p class="kick">Orbitals in '+last.sub+'</p><div class="shapes">'+
      subOrbs.map((o,i)=>'<span class="sh'+(i===last.orb?" on":"")+'">'+o[2]+
        ' <b>'+(occ[last.sub+":"+i]||0)+'</b></span>').join("")+
      '</div><p style="font-size:12px;color:var(--on3);margin:10px 0 0">'+
      'Each gets one electron before any gets two.</p></div>'+
    (S.e>118?'<div class="blk"><p class="kick" style="color:var(--gold)">This one does not exist</p>'+
      '<p class="note" style="--c:var(--gold)">Nothing past element 118 has ever been made. '+
      (S.e<=120
        ? 'Element '+S.e+' has been attempted \u2014 in Japan and in Russia \u2014 and has not been produced.'
        : 'Element '+S.e+' is far beyond anything anyone has attempted.')+
      ' The name is the IUPAC placeholder built from its digits, and the shape above is '+
      'simply what the filling rule says comes next.</p>'+
      (S.e>=121
        ? '<p class="note" style="--c:var(--neg);margin-top:10px"><b>And the rule is probably wrong here.</b> '+
          'At this many protons the inner electrons move fast enough for relativity to matter, '+
          'which reshuffles the order the shells fill in. Detailed calculations disagree with the '+
          'simple rule from about here onward, and disagree with each other too.</p>'
        : '')+
      '<p class="note" style="--c:var(--pri);margin-top:10px">Whether this atom could exist at all is '+
      'a nuclear question, not an electron one. The shell rule will happily draw you element 500. '+
      'It has nothing to say about whether the nucleus holds together for even a microsecond.</p>'+
      '</div>':"")+
    (EXC[S.e]?'<div class="blk"><p class="kick" style="color:var(--neg)">The rule is wrong here</p>'+
      '<p class="note" style="--c:var(--neg)">The filling order predicts this electron goes where the '+
      'walk just put it. Measured, '+el.name+' actually ends <b>'+EXC[S.e]+'</b>. '+
      'About twenty elements break the rule. Nobody predicted which ones \u2014 they were measured.</p></div>':"")+
    '<div class="blk"><p class="kick">Configuration</p><div class="cfg">'+
      parts.map(p=>'<span class="'+(p.now?"now":"done")+'">'+p.t+'</span>').join("")+'</div></div>'+
    (function(){
      const AL=1/137.035999, beta=S.e*AL;
      const gam=beta<1?1/Math.sqrt(1-beta*beta):null;
      const pct=Math.min(100,beta*100);
      const col=beta<0.5?"var(--mint)":beta<0.87?"var(--gold)":"var(--neg)";
      return '<div class="blk"><p class="kick">Speed of the innermost electron</p>'+
        '<div style="font-family:var(--ff-m);font-size:26px;font-weight:700;color:'+col+';letter-spacing:-.02em">'+
        (beta<1?(beta*100).toFixed(1)+"% of light":"no solution")+'</div>'+
        '<div style="height:6px;border-radius:6px;background:var(--s2);overflow:hidden;margin:9px 0 4px">'+
        '<i style="display:block;height:100%;width:'+pct.toFixed(1)+'%;background:'+col+';border-radius:6px"></i></div>'+
        '<div style="font-family:var(--ff-m);font-size:10.5px;color:var(--on3)">v/c = Z\u00d7\u03b1 = '+
        S.e+' \u00f7 137.04 = '+beta.toFixed(3)+(gam?'   \u00b7   \u03b3 = '+gam.toFixed(2):'')+'</div>'+
        '<p class="note" style="--c:'+col+';margin-top:11px">'+
        (S.e<70
          ? 'Slow enough that relativity barely matters here.'
          : S.e<100
            ? 'Fast enough to bend the chemistry. This is why gold is yellow and mercury is a liquid rather than a solid metal.'
            : S.e<=137
              ? 'Very fast, but the equation still has a solution. The electrons are <b>not</b> what stops the table at 118 \u2014 they have room to about 137, and further once you account for the nucleus having a size.'
              : 'Past Z = 137 the point-nucleus equation has no solution at all. A real nucleus has a size, which softens the pull and moves this wall out to roughly 172.')+
        '</p>'+
        (S.e>118?'<p class="note" style="--c:var(--pri);margin-top:9px">The table stops at 118 anyway. '+
          'That is the nucleus giving up, not the electrons.</p>':'')+
        '</div>';
    })()+
    '<div class="blk"><p class="kick">Show</p><div class="seg" id="viewSeg">'+
      ['new','subshell','shell'].map(v=>'<button data-v="'+v+'" aria-pressed="'+(S.view===v)+'">'+
        (v==="new"?"Newest":v==="subshell"?"Subshell":"Shell")+'</button>').join("")+
      '</div><div class="btnrow" style="margin-top:10px">'+
      '<button class="btn sec" id="spin">'+(S.auto?"Stop turning":"Turn it")+'</button>'+
      '<button class="btn sec" id="reset">Reset view</button></div></div>';
  wire();
}
const row=(k,v)=>"<dt>"+k+"</dt><dd>"+v+"</dd>";
function wire(){
  $("minus").disabled=S.e<=1; $("plus").disabled=S.e>=ZMAX;
  $("minus").onclick=()=>set(S.e-1); $("plus").onclick=()=>set(S.e+1);
  $("slider").oninput=e=>set(+e.target.value);
  $("viewSeg").querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{S.view=b.dataset.v;panel();});
  $("spin").onclick=()=>{S.auto=S.auto?0:1;panel();};
  $("reset").onclick=()=>{S.yaw=0.6;S.pitch=-0.35;S.zoom=1;panel();};
}
function set(v){S.e=Math.max(1,Math.min(ZMAX,v));panel();hud();}
function hud(){
  const es=electrons(S.e),last=es[es.length-1];
  $("orbBig").innerHTML=last.sub+"<sup>"+(es.filter(x=>x.sub===last.sub).length)+"</sup>";
  $("orbSub").innerHTML="<b>"+EL[S.e-1].name+"</b>"+(EL[S.e-1].predicted?' <span style="color:var(--gold)">predicted only</span>':"")+" &middot; electron "+S.e+" enters "+last.label;
  $("hudTR").innerHTML="n = <b>"+last.n+"</b><br>ℓ = <b>"+last.lq+"</b> ("+"spdf"[last.lq]+")<br>"+
    "nodes = <b>"+last.lq+"</b>";
}

/* ---------- interaction ---------- */
cv.addEventListener("pointerdown",e=>{S.drag={x:e.clientX,y:e.clientY};cv.classList.add("drag");
  cv.setPointerCapture(e.pointerId);});
cv.addEventListener("pointermove",e=>{
  if(!S.drag)return;
  S.yaw+=(e.clientX-S.drag.x)*0.01; S.pitch+=(e.clientY-S.drag.y)*0.01;
  S.pitch=Math.max(-1.5,Math.min(1.5,S.pitch));
  S.drag={x:e.clientX,y:e.clientY};
});
const endDrag=()=>{S.drag=null;cv.classList.remove("drag");};
cv.addEventListener("pointerup",endDrag);cv.addEventListener("pointercancel",endDrag);
cv.addEventListener("wheel",e=>{e.preventDefault();
  S.zoom=Math.max(.45,Math.min(2.4,S.zoom*(e.deltaY>0?.92:1.08)));},{passive:false});
addEventListener("keydown",e=>{
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName))return;
  if(e.key==="ArrowRight"){e.preventDefault();set(S.e+1);}
  if(e.key==="ArrowLeft"){e.preventDefault();set(S.e-1);}
});
$("play").onclick=()=>{
  S.playing=!S.playing;
  $("playIcon").innerHTML=S.playing
    ?'<rect x="6" y="5" width="4" height="14" rx="1.3"/><rect x="14" y="5" width="4" height="14" rx="1.3"/>'
    :'<path d="M8 5.5v13l11-6.5-11-6.5Z"/>';
  $("playTxt").textContent=S.playing?"Pause":"Walk";
  $("play").classList.toggle("on",S.playing);
};
let acc=0,prev=null;
function frame(ts){
  if(prev==null)prev=ts;
  const dt=Math.min(100,ts-prev);prev=ts;
  if(S.playing){acc+=dt; if(acc>420){acc=0; set(S.e>=ZMAX?1:S.e+1);}}
  try{draw(ts/1000);}catch(err){}
  requestAnimationFrame(frame);
}
fit();S.auto=1;panel();hud();requestAnimationFrame(frame);
</script>
