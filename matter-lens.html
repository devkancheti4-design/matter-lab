<script>
"use strict";
/* ============================================================
   CONNECTION — corrected diagnosis
   ============================================================ */
let DIAG={};
probeClaude=async function(ask){
  const framed=(function(){try{return window.self!==window.top;}catch(e){return true;}})();
  DIAG={framed,hasClaude:!!window.claude,hasUse:!!(window.claude&&typeof window.claude.use==="function")};
  if(!DIAG.hasUse){CLAUDE_STATE=framed?"unavailable":"standalone";SAMPLE=null;IMGOK=false;return;}
  if(ask){
    const perms=await window.claude.use("permissions").catch(()=>null);
    if(perms&&typeof perms.request==="function")await perms.request(["sample"]).catch(()=>{});
  }
  const s=await window.claude.use("sample").catch(()=>null);
  SAMPLE=s||null;DIAG.sample=!!s;
  if(!s){CLAUDE_STATE=framed?"unavailable":"standalone";IMGOK=false;return;}
  const lim=await s.limits().catch(()=>null);
  IMGOK=!!(lim&&lim.images);DIAG.images=IMGOK;
  CLAUDE_STATE=IMGOK?"ready":"noimages";
};
renderScanNote=function(){
  const n=$("scanNote");if(!n)return;
  if(CLAUDE_STATE==="checking"){n.innerHTML="";return;}
  if(CLAUDE_STATE==="ready"){
    n.innerHTML=SHOT?'<div class="notice" style="--c:var(--ok)">'+NICO+
      '<div><b>Ready.</b> Drag a box on the photo to scan just one part, or identify the whole thing. '+
      'This runs on your own Claude account.</div></div>':"";
    return;}
  const copy={
    standalone:["This page is open in its own tab.",
      "The Lens can only reach Claude when the page runs inside Claude — in the chat panel or the artifact viewer. "+
      "Open it from your Claude conversation and the camera will work. Everything else on this page works here."],
    unavailable:["Claude has not been allowed yet.",
      "Photo recognition needs your permission to use Claude on this page."],
    noimages:["Photos are not supported in this view.",
      "Claude is reachable but this viewer cannot send images to it."]
  }[CLAUDE_STATE]||["The Lens is off.",""];
  n.innerHTML='<div class="notice" style="--c:var(--warn)">'+NICO+'<div><b>'+esc(copy[0])+'</b> '+esc(copy[1])+
    (CLAUDE_STATE==="unavailable"?'<div style="margin-top:10px"><button class="btn tonal" id="rcCon" '+
      'style="width:auto;padding:8px 16px;font-size:13px">Allow Claude</button></div>':"")+
    '<div style="margin-top:9px;font-size:11px;color:var(--stage-on2);font-family:var(--ff-m)">'+
    'diagnostic · framed:'+(DIAG.framed?"yes":"no")+' · api:'+(DIAG.hasUse?"yes":"no")+
    ' · sample:'+(DIAG.sample?"yes":"no")+' · images:'+(DIAG.images?"yes":"no")+'</div>'+
    '</div></div>';
  const rc=$("rcCon");
  if(rc)rc.onclick=async()=>{rc.disabled=true;rc.textContent="Asking…";
    await probeClaude(true);renderScanButtons();
    toast(CLAUDE_STATE==="ready"?"Connected — the Lens is live":"Still unavailable in this view");};
};

/* ============================================================
   REGION SELECT
   ============================================================ */
let SEL=null,SELimg=null;
showShot=function(blob){
  stopCam();SHOT=blob;SEL=null;
  const url=URL.createObjectURL(blob);
  vp.innerHTML='<img class="fit" alt="What you are about to scan" src="'+url+'">'+
    '<div class="seltarget" id="selT"></div><div class="selhint">Drag a box to scan just one part</div>';
  const im=vp.querySelector("img");
  im.onload=()=>{SELimg={w:im.naturalWidth,h:im.naturalHeight};};
  const T=$("selT");
  let a=null;
  T.addEventListener("pointerdown",ev=>{
    const r=vp.getBoundingClientRect();
    a={x:ev.clientX-r.left,y:ev.clientY-r.top};
    T.setPointerCapture(ev.pointerId);
  });
  T.addEventListener("pointermove",ev=>{
    if(!a)return;
    const r=vp.getBoundingClientRect();
    const x=ev.clientX-r.left,y=ev.clientY-r.top;
    SEL={x:Math.min(a.x,x),y:Math.min(a.y,y),w:Math.abs(x-a.x),h:Math.abs(y-a.y)};
    drawSel();
  });
  const end=()=>{a=null;
    if(SEL&&(SEL.w<24||SEL.h<24)){SEL=null;drawSel();}
    renderScanButtons();};
  T.addEventListener("pointerup",end);T.addEventListener("pointercancel",end);
  renderScanButtons();
};
function drawSel(){
  let b=vp.querySelector(".selbox");
  if(!SEL){if(b)b.remove();const h=vp.querySelector(".selhint");if(h)h.textContent="Drag a box to scan just one part";return;}
  if(!b){b=document.createElement("div");b.className="selbox";vp.appendChild(b);}
  b.style.left=SEL.x+"px";b.style.top=SEL.y+"px";b.style.width=SEL.w+"px";b.style.height=SEL.h+"px";
  const h=vp.querySelector(".selhint");
  if(h)h.textContent="Scanning just this part — drag again to change it";
}
function cropShot(){
  return new Promise(res=>{
    if(!SHOT)return res(null);
    if(!SEL||!SELimg)return res(SHOT);
    const img=new Image();
    img.onload=()=>{
      const r=vp.getBoundingClientRect();
      const sc=Math.min(r.width/img.naturalWidth,r.height/img.naturalHeight);
      const dw=img.naturalWidth*sc,dh=img.naturalHeight*sc;
      const dx=(r.width-dw)/2,dy=(r.height-dh)/2;
      let sx=(SEL.x-dx)/sc, sy=(SEL.y-dy)/sc, sw=SEL.w/sc, sh=SEL.h/sc;
      sx=Math.max(0,Math.min(img.naturalWidth-1,sx));
      sy=Math.max(0,Math.min(img.naturalHeight-1,sy));
      sw=Math.max(8,Math.min(img.naturalWidth-sx,sw));
      sh=Math.max(8,Math.min(img.naturalHeight-sy,sh));
      const c=document.createElement("canvas");
      const out=Math.min(900,Math.max(sw,sh));
      const k=out/Math.max(sw,sh);
      c.width=Math.round(sw*k);c.height=Math.round(sh*k);
      c.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
      c.toBlob(b=>res(b||SHOT),"image/jpeg",.9);
    };
    img.onerror=()=>res(SHOT);
    img.src=URL.createObjectURL(SHOT);
  });
}
const _rsb=renderScanButtons;
renderScanButtons=function(){
  _rsb();
  if(SHOT){
    const box=$("scanBtns"),first=box.firstChild;
    const ready=(CLAUDE_STATE==="ready");
    if(first){
      first.lastChild.textContent=ready
        ?(SEL?" Identify the selected part":" Identify this")
        :" Identification needs Claude";
      if(!ready){
        first.classList.add("sec");
        first.onclick=()=>{
          renderScanNote();
          toast("Open this page inside Claude to identify photos");
          const n=$("scanNote"); if(n) n.scrollIntoView({block:"nearest",behavior:"smooth"});
        };
      }
    }
    if(SEL){
      const clr=document.createElement("button");
      clr.className="btn sec";clr.textContent="Whole image";
      clr.onclick=()=>{SEL=null;drawSel();renderScanButtons();};
      box.appendChild(clr);
    }
  }
};

/* ============================================================
   LENS v2 — region aware, with provenance and a make-route
   ============================================================ */
const LENS2=
"You are the recognition step of a chemistry app for children aged about 10 to 15.\n"+
"The image is either a whole photo or a region a child cropped out of one. Identify the single "+
"most prominent object IN THIS IMAGE.\n\n"+
"Reply with ONLY a JSON object of exactly this shape:\n"+
'{"label":"Lemon","real":true,"kind":"fruit",'+
'"blurb":"One or two vivid plain-English sentences, at most 40 words.",'+
'"parts":[{"formula":"H2O","pct":88},{"formula":"C6H8O7","pct":6}],'+
'"howMade":[{"step":"Grown","detail":"One short plain sentence."}],'+
'"caution":""}\n\n'+
"Rules:\n"+
"- Every \"formula\" is a real chemical formula from standard element symbols: H2O, NaCl, C6H12O6, SiO2, Fe, CaCO3. "+
"For an object of one metal or element use the bare symbol.\n"+
"- 1 to 5 substances, most abundant first, pct roughly summing to 100.\n"+
"- \"howMade\": 2 to 5 steps describing at an ENCYCLOPEDIC level how this thing comes to exist or is "+
"manufactured industrially. Plain language a 12-year-old follows.\n"+
"- IMPORTANT: never give quantities, reagent recipes, temperatures, or a procedure anyone could actually "+
"follow. Describe the route conceptually only. This is for children.\n"+
"- \"caution\": one short sentence ONLY if this involves something genuinely hazardous, otherwise \"\".\n"+
"- If the subject is fictional, imaginary or not a real material, set \"real\" to false and give your best "+
"playful guess anyway.\n"+
"- If you truly cannot tell, use label \"Unclear\" and an empty parts array.\n"+
"- No text outside the JSON.";

identify=async function(){
  if(!SAMPLE||!SHOT)return;
  const prev=vp.innerHTML;
  const busy=document.createElement("div");
  busy.className="busy";
  busy.innerHTML='<div><div class="ring"></div><div style="font-size:13px">'+
    (SEL?"Looking at that part…":"Looking at it…")+'</div>'+
    '<div style="font-size:11.5px;opacity:.7;margin-top:5px">a few seconds</div></div>';
  vp.appendChild(busy);
  try{
    const blob=await cropShot();
    const data=await SAMPLE.json(LENS2,{images:blob,modelTier:"default"});
    const label=String(data&&data.label||"").trim();
    const raw=Array.isArray(data&&data.parts)?data.parts:[];
    const parts=[];
    raw.forEach(p=>{
      const f=String(p&&p.formula||"").replace(/\s+/g,"");
      if(!f||!parseFormula(f))return;
      parts.push([f,Math.max(.01,Math.min(100,Number(p.pct)||0))]);
    });
    if(!label||label.toLowerCase()==="unclear"||!parts.length){
      busy.remove();
      $("scanNote").innerHTML='<div class="notice" style="--c:var(--warn)">'+NICO+
        '<div><b>No clear match.</b> Try a closer, better-lit shot — or drag a box around one '+
        'object instead of the whole scene.</div></div>';
      toast("Could not read that one");
      return;
    }
    const steps=(Array.isArray(data.howMade)?data.howMade:[]).slice(0,5)
      .map(s=>({step:String(s&&s.step||"").slice(0,60),detail:String(s&&s.detail||"").slice(0,200)}))
      .filter(s=>s.step||s.detail);
    const sb=substanceOf(parts[0][0]);
    S.specimen={label,blurb:String(data.blurb||"").slice(0,240)||"Scanned with the camera.",
      c:KIND[sb.kind][2],source:"lens",parts,howMade:steps,
      real:data.real!==false,kind:String(data.kind||"").slice(0,40),
      caution:String(data.caution||"").slice(0,180),region:!!SEL};
    const dropped=raw.length-parts.length;
    stopCam();go("object");
    toast(dropped>0?("Identified · "+dropped+" unreadable formula"+(dropped>1?"s":"")+" skipped")
                   :("Identified: "+label));
  }catch(e){
    busy.remove();
    const msg={not_granted:"You declined Claude access, so the Lens is off. The specimens still work.",
      rate_limited:"Too many requests just now. Wait a moment and try again.",
      images_unavailable:"This viewer cannot send photos to Claude.",
      image_rejected:"That image could not be read. Try a smaller or clearer photo.",
      invalid_json:"The answer came back garbled. Try once more.",
      refused:"Claude declined to identify that image.",
      cancelled:""}[e&&e.code]||"Something went wrong reaching Claude. Try again.";
    if(msg)$("scanNote").innerHTML='<div class="notice" style="--c:var(--bad)">'+NICO+
      '<div><b>Lens failed.</b> '+esc(msg)+'</div></div>';
    vp.innerHTML=prev;
  }
};

/* ---------- sources: real reference works + deterministic lookups ---------- */
const REFWORKS=[
 ["NIST Chemistry WebBook","Thermochemical and spectral data, US National Institute of Standards and Technology","https://webbook.nist.gov/chemistry/"],
 ["PubChem","Open chemical database, US National Library of Medicine","https://pubchem.ncbi.nlm.nih.gov/"],
 ["IUPAC Gold Book","The agreed definitions of chemical terminology","https://goldbook.iupac.org/"],
 ["CRC Handbook of Chemistry and Physics","The standard printed reference for physical constants","https://hbcp.chemnetbase.com/"],
 ["Review of Particle Physics","Particle Data Group — the source for quark and electron figures","https://pdg.lbl.gov/"]
];
function sourceLinks(formula,name){
  const f=encodeURIComponent(formula), n=encodeURIComponent(name||formula);
  return [
   ["PubChem","look up "+formula,"https://pubchem.ncbi.nlm.nih.gov/#query="+f],
   ["NIST WebBook","measured data","https://webbook.nist.gov/cgi/cbook.cgi?Formula="+f+"&NoIon=on&Units=SI"],
   ["Wikipedia","plain-language overview","https://en.wikipedia.org/w/index.php?search="+n]
  ];
}
function srcBlock(formula,name){
  let h='<div class="blk"><p class="kicker">Check it yourself</p>';
  sourceLinks(formula,name).forEach(([t,w,u])=>{
    h+='<div class="srcline"><a href="'+u+'" target="_blank" rel="noopener noreferrer">'+t+'</a>'+
       '<span class="w">'+w+'</span></div>';});
  h+='<p class="muted" style="margin-top:10px;font-size:11.5px">These are live searches on real databases, '+
     'not citations I generated. Nothing on this page invents a reference.</p></div>';
  return h;
}
const _panelObject=panelObject;
panelObject=function(){
  const sp=S.specimen;
  if(!sp)return _panelObject();
  let h=_panelObject();
  const col=sp.c||"var(--pri)";
  let extra="";
  if(sp.real===false)extra+='<div class="blk"><div class="notice" style="--c:var(--a-atom)">'+NICO+
    '<div><b>This one is not real.</b> Claude could not match it to an actual material, so what follows '+
    'is an informed guess about something imaginary. Treat it as a story, not chemistry.</div></div></div>';
  if(sp.region)extra+='<div class="blk"><p class="muted" style="font-size:12px">'+
    'Read from the part of the photo you boxed, not the whole image.</p></div>';
  if(sp.caution)extra+='<div class="blk"><div class="notice" style="--c:var(--bad)">'+NICO+
    '<div><b>Careful.</b> '+esc(sp.caution)+'</div></div></div>';
  if(sp.howMade&&sp.howMade.length){
    extra+='<div class="blk"><p class="kicker">How it is made</p><div class="steps">';
    sp.howMade.forEach((s,i)=>{
      extra+='<div class="step"><div class="n">'+(i+1)+'</div><div class="t">'+
        (s.step?'<b>'+esc(s.step)+'</b>':"")+esc(s.detail)+'</div></div>';});
    extra+='</div><p class="muted" style="margin-top:11px;font-size:11.5px">Described at a '+
      'library level on purpose — no quantities, no recipe.</p></div>';
  }

  return h+extra;
};
const _panelSubstance=panelSubstance;
panelSubstance=function(){
  const sb=S.substance;
  return _panelSubstance()+(sb?srcBlock(sb.formula,sb.name):"");
};
/* the v2 probe must run after this block replaced the v1 one */
probeClaude(false).then(()=>{renderScanButtons();});

const _panelAtom=panelAtom;
panelAtom=function(){
  const out=_panelAtom();
  if(S.electron||!S.element)return out;
  return out+'<div class="blk"><p class="kicker">Check it yourself</p>'+
    '<div class="srcline"><a href="https://pubchem.ncbi.nlm.nih.gov/element/'+S.element.z+
    '" target="_blank" rel="noopener noreferrer">PubChem element '+S.element.z+'</a>'+
    '<span class="w">'+esc(S.element.name)+'</span></div>'+
    '<div class="srcline"><a href="https://webbook.nist.gov/cgi/cbook.cgi?Formula='+S.element.sym+
    '&NoIon=on&Units=SI" target="_blank" rel="noopener noreferrer">NIST WebBook</a>'+
    '<span class="w">measured data</span></div></div>';
};
</script>

<script>
"use strict";
/* ============================================================
   ACCESSIBILITY — every canvas object mirrored as a real button
   ============================================================ */
const A11Y=$("a11y"),ANN=$("ann");
A11Y.insertAdjacentHTML("beforeend",
  '<div class="a11y-help">Tab through the objects · Enter to open</div>');
let a11ySig="",a11yBtns=[];
function announce(msg){ANN.textContent="";setTimeout(()=>{ANN.textContent=msg;},40);}

function ordinal(i,n){return (i+1)+" of "+n;}
function a11yLabel(h,n){
  const el2=S.element;
  switch(h.kind){
    case "part":{
      const pr=S.specimen&&S.specimen.parts[h.i];
      if(!pr)return "Substance";
      const sb=substanceOf(pr[0]);
      return sb.name+", "+pr[1]+" percent, formula "+spellFormula(pr[0])+
        ". Open this substance.";}
    case "mol":
      return S.substance.name+" molecule "+ordinal(h.i,n)+". Isolate one molecule.";
    case "atom":{
      const e=BY_SYM[h.sym];
      return e?(e.name+" atom"+(n>1?", "+ordinal(h.i,n):"")+". Open this atom."):"Atom";}
    case "e":{
      const list=electronList(S.nE),x=list[h.idx];
      if(!x)return "Electron";
      return "Electron "+ordinal(h.idx,S.nE)+", shell "+(SHELL_LETTER[x.n-1]||x.n)+
        ", "+x.sub+" orbital, spin "+x.spin+". Open this electron.";}
    case "nuc":
      return "Nucleus, "+S.nP+" protons and "+S.nN+" neutrons. Go inside the nucleus.";
    case "nucleon":{
      const isP=h.i<S.nP;
      return (isP?"Proton ":"Neutron ")+(isP?ordinal(h.i,S.nP):ordinal(h.i-S.nP,S.nN))+
        ". Go inside it and see its quarks.";}
    case "q":{
      const nu=S.nucleon,flav=nu&&nu.type==="p"?["u","u","d"]:["u","d","d"];
      const Q=QUARKS[flav[h.i]];
      return Q?(Q.name+", charge "+Q.q+". Open this quark."):"Quark";}
  }
  return "Object";
}
function spellFormula(f){
  return String(f).replace(/([A-Z][a-z]?)(\d*)/g,(m,el2,n)=>
    (BY_SYM[el2]?BY_SYM[el2].name:el2)+(n?" "+n:"")+" ").trim();
}
function sceneSummary(){
  switch(S.scale){
    case "object":return S.specimen?(S.specimen.label+": "+S.specimen.parts.length+
      " substances shown as bubbles sized by how much there is."):"Nothing scanned yet.";
    case "substance":return "Many "+S.substance.name+" units together.";
    case "molecule":return "One "+S.substance.name+" molecule, "+
      (S.struct?S.struct.atoms.length+" atoms":"a repeating structure")+".";
    case "atom":return (S.element?S.element.name:"An")+" atom: nucleus at the centre with "+
      S.nE+" electrons in "+shellsOfList(electronList(S.nE)).filter(x=>x).length+" shells.";
    case "nucleus":return "Nucleus with "+S.nP+" protons and "+S.nN+" neutrons.";
    case "quark":return "Inside a "+(S.nucleon&&S.nucleon.type==="p"?"proton":"neutron")+
      ": three quarks bound by gluons.";
  }
  return "";
}
function syncA11y(){
  const sig=S.scale+"|"+HOT.map(h=>h.kind+":"+(h.i!=null?h.i:h.idx)).join(",");
  if(sig!==a11ySig){
    a11ySig=sig;
    a11yBtns.forEach(b=>b.remove());a11yBtns=[];
    const n=HOT.length;
    HOT.forEach((h,k)=>{
      const b=document.createElement("button");
      b.type="button";b.textContent=a11yLabel(h,n);
      b.onclick=()=>{const cur=HOT[k]||h;if(cur.go){cur.go();announce(sceneSummary());}};
      A11Y.appendChild(b);a11yBtns.push(b);
    });
    cv.setAttribute("aria-label",sceneSummary()+
      " Its "+n+" clickable objects are listed as buttons after this canvas.");
  }
  for(let k=0;k<a11yBtns.length&&k<HOT.length;k++){
    const h=HOT[k],b=a11yBtns[k],d=Math.max(22,h.r*2);
    b.style.left=(h.x-d/2)+"px";b.style.top=(h.y-d/2)+"px";
    b.style.width=d+"px";b.style.height=d+"px";
  }
}
let lastSync=0;
(function a11yLoop(ts){
  if(ts-lastSync>140){lastSync=ts;
    if($("sc-view").classList.contains("live")){try{syncA11y();}catch(e){}}}
  requestAnimationFrame(a11yLoop);
})(0);
const _go2=go;
go=function(id){_go2(id);announce(sceneSummary());};
</script>
